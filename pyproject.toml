[build-system]
requires = ["setuptools>=62.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-esa-agents"
version = "0.5.5"
description = "Standalone LangGraph agent graphs for EVE / Pi School backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Keep upper bounds conservative so `pip install eve-esa-agents` into an app that
# pins langgraph==1.0.x does not pull langgraph 1.1+ and a different langchain-core.
dependencies = [
    "langchain-core>=0.3,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "tiktoken>=0.6,<1",
]

[project.optional-dependencies]
deep = [
    "deepagents>=0.7.32,<0.8",
    "langchain>=1.4.7,<2",
]
dev = [
    "pytest>=8,<9",
    "build>=1,<2",
    "deepagents>=0.7.32,<0.8",
    "langchain>=1.4.7,<2",
]

[project.urls]
Homepage = "https://github.com/eve-esa/agents"
Repository = "https://github.com/eve-esa/agents"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.setuptools.package-data]
"agents.graphs.deep" = ["prompts.yaml"]
"agents.graphs.react" = ["prompts.yaml"]
"agents.graphs.simple" = ["prompts.yaml"]
